function building(a,x,y,w,h,door=1){rect(a,x,y,w,h,'b');a[y+h-1][x+door]='d'}

 a=grid('c');border(a);rect(a,2,14,44,3,'f');rect(a,12,3,3,11,'f');rect(a,32,17,3,12,'f');for(let i=0;i<22;i++){const x=3+(i*17)%40,y=3+(i*11)%24;rect(a,x,y,2,2,'#')}m.grotto={id:'grotto',title:'Shiverstone Cave',theme:'cave',tiles:a,warps:[{x:1,y:15,to:'grove',tx:45,ty:15},{x:47,y:15,to:'city',tx:4,ty:24}],encounters:[['pebblyt',9],['rockhorn',10],['magmole',13],['voltbit',9]],npcs:[{x:22,y:12,name:'Miner Jax',kind:'trainer',dir:'left',team:['pebblyt','rockhorn'],reward:550,flag:'miner',text:['Miner Jax: Rock and resolve!']}]};
 a=grid('r');border(a);rect(a,0,14,MW,3,'r');building(a,10,5,9,7,4);building(a,22,5,9,7,4);building(a,34,5,9,7,4);rect(a,3,22,10,6,'#');rect(a,18,22,12,6,'#');m.city={id:'city',title:'Lumina City',theme:'city',tiles:a,warps:[{x:14,y:11,kind:'center'},{x:26,y:11,kind:'shop'},{x:38,y:11,kind:'gym'},{x:1,y:15,kind:'grove'},{x:1,y:24,kind:'grotto'},{x:47,y:15,to:'route1',tx:45,ty:15},{x:47,y:24,kind:'champion'}],npcs:[{x:17,y:17,name:'City Guide',kind:'guide',text:['Gym badges unlock the paths beyond Lumina. Find the three leaders, then return to the east gate.']}]};

 for(let i=1;i<=3;i++){m['gym'+i]=interior('gym'+i,['Cinder Gym','Tide Gym','Volt Gym'][i-1],['gymfire','gymwater','gymelectric'][i-1]);m['gym'+i].warps=[{x:24,y:29,to:'city',tx:38,ty:12}];m['gym'+i].npcs=[{x:24,y:10,name:['Leader Ember','Leader Marina','Leader Jolt'][i-1],kind:'gym',gym:i,dir:'down',team:[i===1?['flarlet','magmole']:i===2?['brookit','tiderill']:['sparkbun','glimmerfin']][0],reward:800+i*500,flag:'gym'+i,text:[['Leader Ember: Let the first spark become a flame!'],['Leader Marina: Flow around every obstacle!'],['Leader Jolt: Speed decides everything!']][i-1]}]}
 m.champion=interior('champion','Veyra Summit','champion');m.champion.warps=[{x:24,y:29,to:'city',tx:47,ty:24}];m.champion.npcs=[{x:24,y:10,name:'Champion Astra',kind:'champion',team:['pyrolynx','tiderill','voltiger'],reward:2500,flag:'champion',text:['Champion Astra: Three badges prove you are ready. Now prove you can lead.']}];return m}

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const S={scene:'title',titleIndex:0,starterIndex:0,map:'home',player:{x:14,y:15,fromX:14,fromY:15,toX:14,toY:15,p:0,moving:false,dir:'down'},party:[],box:[],active:0,money:500,inventory:{ball:5,great:1,potion:3,super:0,revive:1,antidote:2,paracure:1,awakening:1},badges:[],flags:{},dialogue:null,menuIndex:0,partyIndex:0,bagIndex:0,shopIndex:0,shopMode:'buy',battle:null,transition:null,evolution:null,toast:'',muted:false,last:0,camX:0,camY:0};

function beep(f=440,d=.08,type='square',v=.035){if(S.muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function music(){if(S.muted||musicTimer)return;const notes=[261,329,392,523,392,329];let i=0;musicTimer=setInterval(()=>{if(S.scene!=='battle'&&S.scene!=='dialogue')beep(notes[i++%notes.length],.06,'square',.012)},600)}function stopMusic(){clearInterval(musicTimer);musicTimer=0}
function text(t,x,y,size=10,color=varColor('--ink'),align='left'){ctx.font=`${size}px "Courier New",monospace`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}function varColor(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function panel(x,y,w,h,fill='#1d2935',line='#9b7741'){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);ctx.strokeStyle=line;ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,h-2)}
function wrap(t,max){const out=[];let line='';for(const word of String(t).split(' ')){if((line+' '+word).trim().length>max){out.push(line);line=word}else line=(line+' '+word).trim()}if(line)out.push(line);return out}
function say(lines,done){S.dialogue={lines,index:0,chars:0,done:done||null};S.scene='dialogue';beep(300,.05)}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({map:S.map,player:{x:S.player.x,y:S.player.y,dir:S.player.dir},party:S.party,box:S.box,active:S.active,money:S.money,inventory:S.inventory,badges:S.badges,flags:S.flags,muted:S.muted}));toast('Game saved.')}catch(e){toast('Save unavailable in this browser.')}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(!d)return false;Object.assign(S,{map:d.map||'home',party:d.party||[],box:d.box||[],active:d.active||0,money:d.money||500,inventory:d.inventory||S.inventory,badges:d.badges||[],flags:d.flags||{},muted:!!d.muted,scene:'world'});Object.assign(S.player,d.player||{});return true}catch(e){return false}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
function toast(s){S.toast=s;setTimeout(()=>{if(S.toast===s)S.toast=''},2200)}

function typeMult(atk,defs){return defs.reduce((n,d)=>n*(CHART[atk]?.[d]??1),1)}
function active(){return S.party[S.active]}
function healthy(){return S.party.filter(m=>m.hp>0)}
function healAll(){S.party.forEach(m=>{m.hp=m.maxHp;m.status=null;m.statusTurns=0;m.moves.forEach(q=>q.pp=q.max)})}
 function levelUp(m,xp){const notes=[];m.xp+=xp;while(m.xp>=m.next){m.xp-=m.next;m.level++;const old=m.maxHp;Object.assign(m,stats(m.id,m.level));m.hp=Math.min(m.maxHp,m.hp+(m.maxHp-old)+2);m.next=Math.floor(m.level*m.level*12);notes.push(`${m.nickname} reached level ${m.level}!`);const d=CREATURES[m.id];if(d.evo&&m.level>=d.evo&&d.to){S.evolution={mon:m,to:d.to,returnScene:'world'};break}}return notes}
 function evolveDone(){if(!S.evolution)return;const e=S.evolution,m=e.mon,to=e.to;m.id=to;m.nickname=CREATURES[to].name;const s=stats(to,m.level);Object.assign(m,s,{hp:s.maxHp,moves:CREATURES[to].moves.slice(0,4).map(id=>({id,pp:MOVES[id].pp,max:MOVES[id].pp}))});S.evolution=null;S.battle=null;S.scene='world';say([`${m.nickname} emerged from the glow!`,`A new bond begins with ${m.nickname}.`])}

/* ========================= WORLD ========================= */
 function walkable(x,y){const a=MAPS[S.map]?.tiles;if(!a||!a[y]||!a[y][x])return false;if(warpAt(x,y))return true;return !'#b'.includes(a[y][x])}
function npcAt(x,y){return(MAPS[S.map].npcs||[]).find(n=>n.x===x&&n.y===y)}
function warpAt(x,y){return(MAPS[S.map].warps||[]).find(w=>w.x===x&&w.y===y)}
function tryMove(dx,dy){if(S.scene!=='world'||S.player.moving)return;const p=S.player;p.dir=dx<0?'left':dx>0?'right':dy<0?'up':'down';const nx=p.x+dx,ny=p.y+dy;if(!walkable(nx,ny)||npcAt(nx,ny))return;p.fromX=p.x;p.fromY=p.y;p.toX=nx;p.toY=ny;p.p=0;p.moving=true;beep(180,.025)}
function finishStep(){const p=S.player;p.x=p.toX;p.y=p.toY;p.moving=false;const w=warpAt(p.x,p.y);if(w){useWarp(w);return}const tile=MAPS[S.map].tiles[p.y][p.x];if(tile==='t'&&MAPS[S.map].encounters&&Math.random()<.1){const e=MAPS[S.map].encounters[Math.floor(Math.random()*MAPS[S.map].encounters.length)];startBattle([cloneMon(e[0],e[1]+Math.floor(Math.random()*3))],'wild',null);return}checkSight()}
function useWarp(w){if(w.kind==='center'){transition('center',24,28);return}if(w.kind==='shop'){transition('shop',24,28);return}if(w.kind==='gym'){if(S.badges.length>=3){transition('champion',24,28);return}transition('gym'+(S.badges.length+1),24,28);return}if(w.kind==='grove'&&S.badges.length<1){say(['A guard blocks the forest path.','Earn the Ember Badge first.']);return}if(w.kind==='grotto'&&S.badges.length<2){say(['The cave gate is sealed with a tide sigil.','Earn the Tide Badge first.']);return}if(w.kind==='champion'&&S.badges.length<3){say(['The eastern gate recognizes three empty badge slots.','Return after conquering every gym.']);return}if(w.to)transition(w.to,w.tx,w.ty)}
 function transition(to,x,y){S.scene='world';S.transition={a:0,to,x,y,phase:'out'};}
function checkSight(){const map=MAPS[S.map];for(const n of map.npcs||[]){if(!['trainer','rival'].includes(n.kind)||S.flags[n.flag])continue;const p=S.player;if(n.dir==='left'&&p.y===n.y&&p.x<n.x&&n.x-p.x<=5||n.dir==='right'&&p.y===n.y&&p.x>n.x&&p.x-n.x<=5||n.dir==='up'&&p.x===n.x&&p.y<n.y&&n.y-p.y<=5||n.dir==='down'&&p.x===n.x&&p.y>n.y&&p.y-n.y<=5){say(n.text,()=>startTrainer(n));return}}}
function facePos(){const p=S.player;return{x:p.x+(p.dir==='left'?-1:p.dir==='right'?1:0),y:p.y+(p.dir==='up'?-1:p.dir==='down'?1:0)}}
function interact(){if(S.scene!=='world')return;const q=facePos(),n=npcAt(q.x,q.y);if(n){if(n.kind==='nurse'){say(n.text,()=>{healAll();toast('Party fully restored!')});return}if(n.kind==='shop'){say(n.text,()=>S.scene='shop');return}if(n.kind==='gym'||n.kind==='champion'||n.kind==='trainer'||n.kind==='rival'){say(n.text,()=>startTrainer(n));return}say(n.text);return}const w=warpAt(S.player.x,S.player.y);if(w)useWarp(w)}
function startTrainer(n){if(S.scene==='battle')return;const teams=Array.isArray(n.team)?n.team.map(x=>typeof x==='string'?cloneMon(x,Math.max(6,S.badges.length*4+6)):x):[];startBattle(teams,n.kind==='gym'?'gym':n.kind==='champion'?'champion':'trainer',()=>{S.flags[n.flag]=true;if(n.kind==='gym'){S.badges.push(n.gym);say([`${n.name} hands you the ${['Ember','Tide','Volt'][n.gym-1]} Badge!`,'The next road is open.'],()=>transition('city',38,12))}else if(n.kind==='champion'){S.scene='ending'}else{S.money+=n.reward||0;say([`${n.name} was defeated!`,`You earned ₽${n.reward||0}.`])}})}

/* ========================= BATTLE ========================= */
function startBattle(team,kind,onWin){if(!active()||!healthy().length){healAll();S.active=0}S.scene='battle';S.battle={kind,enemyTeam:team,enemyIndex:0,menu:'main',menuIndex:0,busy:true,message:kind==='wild'?`A wild ${CREATURES[team[0].id].name} appeared!`:`${kind==='champion'?'Champion Astra':kind==='gym'?'Gym Leader':''} challenges you!`,onWin,swirl:1,participants:new Set([S.active])};stopMusic();setTimeout(()=>{if(S.battle){S.battle.busy=false;S.battle.swirl=0}},700);beep(90,.18,'sawtooth')}
function currentEnemy(){return S.battle.enemyTeam[S.battle.enemyIndex]}function usableMoves(m){return m.moves.filter(q=>q.pp>0)}
function chooseEnemy(){const e=currentEnemy(),p=active(),u=usableMoves(e);if(!u.length)return{id:'tackle',pp:1,max:1};const good=u.filter(q=>typeMult(MOVES[q.id].type,CREATURES[p.id].types)>1);return(good.length&&Math.random()<.72?good:u)[Math.floor(Math.random()*(good.length&&Math.random()<.72?good:u).length)]}
function damage(att,def,mv){if(mv.power===0)return 0;const mod=typeMult(mv.type,CREATURES[def.id].types),crit=Math.random()<.06,variance=.85+Math.random()*.15;let d=Math.floor((((2*att.level/5+2)*mv.power*att.atk/def.def)/50+2)*mod*variance*(crit?(mv.crit||1.5):1));return{damage:Math.max(1,d),mod,crit}}
function useMove(att,def,q){const mv=MOVES[q.id];if(Math.random()*100>mv.acc){S.battle.message=`${CREATURES[att.id].name} used ${mv.name}, but it missed!`;return}if(mv.heal){const gain=Math.max(1,Math.floor(att.maxHp*mv.heal));att.hp=Math.min(att.maxHp,att.hp+gain);S.battle.message=`${CREATURES[att.id].name} restored ${gain} HP!`;return}const d=damage(att,def,mv);if(mv.power){def.hp=Math.max(0,def.hp-d.damage);S.battle.message=`${CREATURES[att.id].name} used ${mv.name}! ${d.damage} damage${d.crit?' Critical hit!':''}${d.mod>1?' Super effective!':d.mod===0?' It had no effect.':d.mod<1?' Not very effective.':''}`;if(d.mod>0)beep(d.crit?720:430,.1)}if(mv.status&&Math.random()<mv.chance&&(!def.status||def.status==='slow')){def.status=mv.status;def.statusTurns=mv.status==='sleep'?2:3;S.battle.message+=` ${CREATURES[def.id].name} is ${mv.status}!`}}
 function endStatus(m){if(!m.status)return;if(m.status==='poison'||m.status==='burn'){const n=Math.max(1,Math.floor(m.maxHp/12));m.hp=Math.max(0,m.hp-n);S.battle.message+=` ${m.nickname} took ${n} status damage.`}if(m.status==='sleep'||m.status==='paralysis'){m.statusTurns--;if(m.statusTurns<=0)m.status=null}}
function actionMove(q){const b=S.battle,p=active(),e=currentEnemy();q.pp--;b.busy=true;useMove(p,e,q);setTimeout(()=>{if(!S.battle)return;if(e.hp<=0){winEnemy();return}endStatus(p);if(p.hp<=0){loseOrSwitch();return}const eq=chooseEnemy();if(eq.id!=='tackle'||usableMoves(e).length)eq.pp=Math.max(0,eq.pp-1);useMove(e,p,eq);setTimeout(()=>{if(!S.battle)return;if(p.hp<=0){loseOrSwitch();return}endStatus(e);if(e.hp<=0){winEnemy();return}b.busy=false;b.menu='main';b.menuIndex=0},500)},550)}
function winEnemy(){const b=S.battle,e=currentEnemy();b.message=`${e.nickname} fainted!`;beep(160,.12,'square');const xp=Math.floor((CREATURES[e.id].exp||60)*e.level/Math.max(1,b.participants.size));for(const i of b.participants){const notes=levelUp(S.party[i],xp);if(notes.length)b.message=notes.join(' ')}setTimeout(()=>{if(b.enemyIndex<b.enemyTeam.length-1){b.enemyIndex++;b.message=`Go, ${currentEnemy().nickname}!`;b.busy=false;return}finishWin()},900)}
function finishWin(){const b=S.battle;if(S.evolution){S.scene='evolution';return}if(b.kind==='wild'){S.scene='world';music();toast('Victory!')}else{S.scene='world';music();if(b.onWin)b.onWin()}S.battle=null}
function loseOrSwitch(){if(healthy().length){S.battle.busy=false;S.battle.menu='switch';S.battle.menuIndex=0;S.battle.message='Choose another companion.'}else{S.battle=null;healAll();S.map='center';S.player.x=24;S.player.y=28;S.scene='world';music();say(['Your whole party fainted.','The Healing Center brought everyone back safely.'])}}
function attemptRun(){const b=S.battle;if(b.kind!=='wild'){b.message='You cannot run from a trainer battle!';return}if(Math.random()<.75){b.message='You got away safely!';b.busy=true;setTimeout(()=>{S.battle=null;S.scene='world';music()},500)}else{b.message='Could not escape!';b.busy=true;setTimeout(()=>{const q=chooseEnemy();useMove(currentEnemy(),active(),q);b.busy=false},500)}}
function catchAttempt(id){const it=ITEMS[id],b=S.battle;if(b.kind!=='wild'){b.message='You can only catch wild creatures.';return}if(!(S.inventory[id]>0)){b.message='Your bag is empty of that ball.';return}S.inventory[id]--;b.busy=true;const e=currentEnemy(),rate=(CREATURES[e.id].catch||120)*it.catch*(1-e.hp/e.maxHp+.25);b.message=`You threw a ${it.name}!`;setTimeout(()=>{if(Math.random()*255<rate){const c=cloneMon(e.id,e.level);if(S.party.length<6)S.party.push(c);else S.box.push(c);b.message=`Gotcha! ${c.nickname} joined ${S.party.length<=6?'your party':'the PC box'}.`;setTimeout(()=>{S.battle=null;S.scene='world';music()},850)}else{b.message='The ball broke open!';setTimeout(()=>{const q=chooseEnemy();useMove(e,active(),q);b.busy=false},650)}},550)}
function useItem(id,inBattle=true){const it=ITEMS[id];if(!(S.inventory[id]>0)){toast('You are out of that item.');return false}if(it.type==='ball'){if(inBattle)catchAttempt(id);return true}let target=active();if(it.type==='revive'){target=S.party.find(m=>m.hp<=0);if(!target){toast('No fainted companion.');return false}target.hp=Math.floor(target.maxHp/2)}else if(it.type==='heal'){if(target.hp<=0||target.hp>=target.maxHp){toast('That would not help now.');return false}target.hp=Math.min(target.maxHp,target.hp+it.heal)}else if(it.type==='cure'){if(target.status!==it.status){toast('No matching status.');return false}target.status=null}S.inventory[id]--;toast(`${it.name} used.`);if(inBattle){S.battle.busy=true;setTimeout(()=>{const q=chooseEnemy();useMove(currentEnemy(),active(),q);S.battle.busy=false;S.battle.menu='main'},500)}return true}
function switchTo(i,free=false){const m=S.party[i];if(!m||m.hp<=0){toast('That companion cannot battle.');return false}if(i===S.active){toast('Already active.');return false}S.active=i;S.battle.participants.add(i);S.battle.message=`Go, ${m.nickname}!`;if(!free){S.battle.busy=true;setTimeout(()=>{if(S.battle){const q=chooseEnemy();useMove(currentEnemy(),active(),q);S.battle.busy=false;S.battle.menu='main'}},550)}else{S.battle.busy=false;S.battle.menu='main'}return true}

/* ========================= INPUT + MENUS ========================= */
function key(k){beep(260,.025);if(S.scene==='title'){if(k==='ArrowUp'||k==='ArrowDown'||k==='w'||k==='s')S.titleIndex=hasSave()?1-S.titleIndex:0;else if(k==='z'||k==='Enter')hasSave()&&S.titleIndex===0?load():reset();return}if(S.scene==='intro'){if(k==='z'||k==='Enter'){if(S.dialogue?.chars<(S.dialogue?.lines[S.dialogue.index]||'').length)S.dialogue.chars=999;else S.scene='starter'}return}if(S.scene==='starter'){if(k==='ArrowLeft'||k==='a'||k==='ArrowUp')S.starterIndex=(S.starterIndex+2)%3;if(k==='ArrowRight'||k==='d'||k==='ArrowDown')S.starterIndex=(S.starterIndex+1)%3;if(k==='z'||k==='Enter'){const id=['spriglet','cindrake','aquaffin'][S.starterIndex];S.party=[makeMon(id,5)];S.active=0;S.flags.started=true;S.scene='world';music();say([`Professor Veya: ${CREATURES[id].name} chose you too!`,'The road to Lumina City begins on Route 1.']);}return}if(S.scene==='dialogue'){if(k==='z'||k==='Enter'){const d=S.dialogue,l=d.lines[d.index]||'';if(d.chars<l.length){d.chars=l.length;return}if(d.index<d.lines.length-1){d.index++;d.chars=0}else{const done=d.done;S.dialogue=null;S.scene='world';if(done)done()}}else if(k==='x'||k==='Escape'){S.dialogue=null;S.scene='world'}return}if(S.scene==='evolution'){if(k==='z'||k==='Enter')evolveDone();return}if(S.scene==='world'){if(k==='ArrowUp'||k==='w')tryMove(0,-1);else if(k==='ArrowDown'||k==='s')tryMove(0,1);else if(k==='ArrowLeft'||k==='a')tryMove(-1,0);else if(k==='ArrowRight'||k==='d')tryMove(1,0);else if(k==='z'||k==='Enter')interact();else if(k==='x'||k==='Escape'||k==='p')S.scene='pause';return}if(S.scene==='pause'){if(k==='ArrowUp'||k==='w')S.menuIndex=(S.menuIndex+4)%5;if(k==='ArrowDown'||k==='s')S.menuIndex=(S.menuIndex+1)%5;if(k==='z'||k==='Enter'){if(S.menuIndex===0){S.partyIndex=0;S.scene='party'}else if(S.menuIndex===1){S.bagIndex=0;S.scene='bag'}else if(S.menuIndex===2)save();else if(S.menuIndex===3){S.muted=!S.muted;try{localStorage.setItem('wildbound-muted',S.muted?'1':'0')}catch(e){}toast(S.muted?'Sound muted':'Sound on')}else S.scene='world'}if(k==='x'||k==='Escape'||k==='p')S.scene='world';return}if(S.scene==='party'){if(k==='ArrowUp'||k==='w')S.partyIndex=(S.partyIndex+5)%6;if(k==='ArrowDown'||k==='s')S.partyIndex=(S.partyIndex+1)%6;if(k==='z'||k==='Enter'&&S.party[S.partyIndex])S.scene='summary';if(k==='x'||k==='Escape')S.scene='pause';return}if(S.scene==='summary'){if(k==='x'||k==='Escape'||k==='z'||k==='Enter')S.scene='party';return}if(S.scene==='bag'){if(k==='ArrowUp'||k==='w')S.bagIndex=(S.bagIndex+SHOP_ITEMS.length-1)%SHOP_ITEMS.length;if(k==='ArrowDown'||k==='s')S.bagIndex=(S.bagIndex+1)%SHOP_ITEMS.length;if(k==='z'||k==='Enter')useItem(SHOP_ITEMS[S.bagIndex],false);if(k==='x'||k==='Escape')S.scene='pause';return}if(S.scene==='shop'){if(k==='ArrowLeft'||k==='a'||k==='ArrowRight'||k==='d')S.shopMode=S.shopMode==='buy'?'sell':'buy';if(k==='ArrowUp'||k==='w')S.shopIndex=(S.shopIndex+SHOP_ITEMS.length-1)%SHOP_ITEMS.length;if(k==='ArrowDown'||k==='s')S.shopIndex=(S.shopIndex+1)%SHOP_ITEMS.length;if(k==='z'||k==='Enter'){const id=SHOP_ITEMS[S.shopIndex],it=ITEMS[id];if(S.shopMode==='buy'){if(S.money>=it.price){S.money-=it.price;S.inventory[id]=(S.inventory[id]||0)+1;toast(`Bought ${it.name}.`)}else toast('Not enough money.')}else if(S.inventory[id]>0){S.inventory[id]--;S.money+=it.sell;toast(`Sold ${it.name}.`)}else toast('Nothing to sell.')}if(k==='x'||k==='Escape')transition('city',26,12);return}if(S.scene==='battle'){battleKey(k);return}}
function battleKey(k){const b=S.battle;if(!b||b.busy)return;const n=b.menu==='main'?4:b.menu==='moves'?b.moves.length:b.menu==='bag'?6:S.party.length;if(k==='ArrowLeft'||k==='a')b.menuIndex=(b.menuIndex+n-1)%n;if(k==='ArrowRight'||k==='d')b.menuIndex=(b.menuIndex+1)%n;if(k==='ArrowUp'||k==='w')b.menuIndex=(b.menuIndex+n-1)%n;if(k==='ArrowDown'||k==='s')b.menuIndex=(b.menuIndex+1)%n;if(k==='x'||k==='Escape'){b.menu=b.menu==='main'?'main':'main';b.menuIndex=0;return}if(k!=='z'&&k!=='Enter')return;if(b.menu==='main'){if(b.menuIndex===0){b.menu='moves';b.moves=active().moves;b.menuIndex=0}else if(b.menuIndex===1){b.menu='bag';b.menuIndex=0}else if(b.menuIndex===2){b.menu='switch';b.menuIndex=0}else attemptRun()}else if(b.menu==='moves'){const q=active().moves[b.menuIndex];if(q&&q.pp>0)actionMove(q);else b.message='That move is out of PP!'}else if(b.menu==='bag'){const ids=['ball','great','potion','super','revive','antidote'];useItem(ids[b.menuIndex],true);if(ids[b.menuIndex]!=='ball'&&ids[b.menuIndex]!=='great'){b.menu='main';b.menuIndex=0}}else if(b.menu==='switch')switchTo(b.menuIndex)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();key(e.key)});document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();key(b.dataset.key)})});

/* ========================= LOOP ========================= */
function update(dt){if(S.scene==='world'&&S.player.moving){S.player.p=Math.min(1,S.player.p+dt*7);if(S.player.p>=1)finishStep()}if(S.scene==='dialogue'&&S.dialogue){S.dialogue.chars=Math.min((S.dialogue.lines[S.dialogue.index]||'').length,S.dialogue.chars+dt*42)}if(S.scene==='evolution'&&S.evolution){/* light waits for Z */}if(S.transition){if(S.transition.phase==='out'){S.transition.a=Math.min(1,S.transition.a+dt*4);if(S.transition.a>=1){S.map=S.transition.to;S.player.x=S.transition.x;S.player.y=S.transition.y;S.player.fromX=S.transition.x;S.player.fromY=S.transition.y;S.player.toX=S.transition.x;S.player.toY=S.transition.y;S.transition.phase='in'}}else{S.transition.a=Math.max(0,S.transition.a-dt*4);if(S.transition.a<=0)S.transition=null}}if(S.battle?.swirl>0)S.battle.swirl=Math.max(0,S.battle.swirl-dt*1.4)}
function loop(t){const dt=Math.min(.05,(t-S.last)/1000||0);S.last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
